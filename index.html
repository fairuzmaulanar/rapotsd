<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Keamanan (P4.5 + v1.5): skrip hanya dari situs ini, data hanya ke server Apps Script sekolah,
       dan Trusted Types: HTML/URL skrip wajib lewat kebijakan "raporkilat" (js/core.js) → cegah DOM-XSS. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; require-trusted-types-for 'script'; trusted-types raporkilat">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Ikuti ukuran teks dari pengaturan HP/OS (aksesibilitas) -->
  <meta name="text-scale" content="scale">
  <title>RaporKilat SD — Rapor Digital Kurikulum Merdeka</title>
  <meta name="description" content="Aplikasi rapor SD Kurikulum Merdeka: grid nilai TP & LM, deskripsi otomatis, kokurikuler 8 dimensi, persetujuan kepala sekolah, QR verifikasi, dan portal orang tua.">
  <meta name="theme-color" content="#1f2638">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RaporKilat">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
  <link rel="stylesheet" href="./css/app.css">
  <!-- JavaScript: config.js (URL server) + satu file gabungan hasil "node build.js". defer = diunduh paralel, dijalankan setelah halaman terbaca -->
  <script src="./js/config.js" defer></script>
  <script src="./js/app.min.js" defer></script>
</head>
<body>
  <a class="skip" href="#view">Lewati ke konten</a>
  <div id="app">
    <div class="boot-splash" role="status"><span class="logo">R</span><span>Memuat RaporKilat SD…</span></div>
  </div>

  <div id="btnPasang" class="pasang" hidden>
    <span class="ic" aria-hidden="true">install_mobile</span>
    <button class="btn sm primary" data-pasang type="button">Pasang aplikasi</button>
    <button class="btn icon sm ghost" data-tutup type="button" aria-label="Tutup">
      <span class="ic sm" aria-hidden="true">close</span></button>
  </div>
  <!-- Satu wilayah pengumuman untuk pembaca layar (sudah ada sejak awal agar pengumuman pertama tidak terlewat) -->
  <div id="pengumuman" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p style="padding:24px">Aplikasi ini memerlukan JavaScript. Aktifkan JavaScript di peramban Anda.</p></noscript>

</body>
</html>
